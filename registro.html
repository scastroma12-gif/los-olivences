<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de estudiante · Universidad César Vallejo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="bienvenida">
    <p class="institucion">Universidad César Vallejo</p>
    <h1 id="titulo">Regístrate en tu aula virtual</h1>
    <p id="descripcion">Crea tu cuenta para continuar.</p>
    <form id="formulario-acceso" class="formulario">
      <div id="campo-nombre">
        <label for="nombre">Nombre completo</label>
        <input id="nombre" type="text" autocomplete="name" placeholder="Ej. María López">
      </div>
      <label for="dni">DNI</label>
      <input id="dni" type="text" inputmode="numeric" maxlength="10" required autocomplete="username" placeholder="7, 8 o 10 dígitos">
      <label for="clave">Contraseña</label>
      <input id="clave" type="password" required minlength="6" autocomplete="current-password">
      <button type="submit" id="boton-enviar" class="boton boton-principal">Crear cuenta</button>
    </form>
    <p id="mensaje" class="error" hidden></p>
    <button type="button" id="cambiar-modo" class="enlace">¿Ya tienes cuenta? Inicia sesión</button>
    <a class="volver" href="index.html">Volver al inicio</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-cliente.js"></script>
  <script src="registro.js"></script>
</body>
</html>
